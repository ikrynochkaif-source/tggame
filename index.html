<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef1e7" />
    <title>AI-Creator: Prompt Empire</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <section class="identity" aria-label="Профіль гравця">
          <div class="mark" aria-hidden="true">AI</div>
          <div>
            <p class="eyebrow">Telegram Mini Game</p>
            <h1>AI-Creator</h1>
          </div>
        </section>
        <button class="ghost-button" id="resetButton" type="button">Скинути</button>
      </header>

      <section class="ticker" aria-live="polite">
        <span id="tickerLabel">Тренд дня</span>
        <strong id="trendText"></strong>
      </section>

      <section class="creator-studio" aria-label="Створення персонажа">
        <article class="avatar-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Персонаж</p>
              <h2>Твій AI-креатор</h2>
            </div>
            <button class="ghost-button small" id="randomAvatarButton" type="button">Рандом</button>
          </div>

          <div class="avatar-stage">
            <svg class="avatar-preview" id="avatarPreview" viewBox="0 0 220 260" role="img" aria-label="Прев'ю персонажа">
              <rect class="avatar-backdrop" x="18" y="18" width="184" height="224" rx="28"></rect>
              <path class="avatar-shadow" d="M56 233c12-30 31-45 56-45s45 15 56 45H56Z"></path>
              <path class="avatar-body" id="avatarBody" d="M63 230c7-45 24-68 49-68s42 23 49 68H63Z"></path>
              <path class="avatar-jacket" id="avatarJacket" d="M73 230c6-35 18-53 39-53s33 18 39 53H73Z"></path>
              <circle class="avatar-neck" id="avatarNeck" cx="112" cy="154" r="18"></circle>
              <path class="avatar-head" id="avatarHead" d="M70 105c0-31 18-56 42-56s42 25 42 56c0 34-17 56-42 56s-42-22-42-56Z"></path>
              <path class="avatar-hair-back" id="avatarHairBack"></path>
              <path class="avatar-hair" id="avatarHair"></path>
              <circle class="avatar-eye" cx="96" cy="111" r="4"></circle>
              <circle class="avatar-eye" cx="128" cy="111" r="4"></circle>
              <path class="avatar-brow" d="M90 100c5-3 11-3 17 0"></path>
              <path class="avatar-brow" d="M122 100c5-3 11-3 17 0"></path>
              <path class="avatar-mouth" id="avatarMouth" d="M100 132c7 6 17 6 24 0"></path>
              <g class="avatar-glasses" id="avatarGlasses">
                <circle cx="96" cy="112" r="13"></circle>
                <circle cx="128" cy="112" r="13"></circle>
                <path d="M109 112h6"></path>
              </g>
              <g class="avatar-earring" id="avatarEarring">
                <circle cx="154" cy="123" r="4"></circle>
              </g>
              <path class="avatar-device" d="M142 198h30c5 0 8 3 8 8v26h-46v-26c0-5 3-8 8-8Z"></path>
              <circle class="avatar-device-dot" cx="157" cy="213" r="3"></circle>
            </svg>
          </div>
        </article>

        <article class="customizer-panel">
          <div class="panel-heading compact">
            <h2>Кастомізація</h2>
            <span id="avatarSummary"></span>
          </div>
          <div class="customizer-grid" id="customizerGrid"></div>
        </article>
      </section>

      <section class="dashboard">
        <article class="command-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Дейлік</p>
              <h2 id="missionTitle"></h2>
            </div>
            <span class="day-pill" id="dayLabel"></span>
          </div>

          <p class="mission-copy" id="missionCopy"></p>

          <div class="project-meter" aria-label="Прогрес проєкту">
            <div class="meter-row">
              <span>Віральність</span>
              <strong id="viralValue"></strong>
            </div>
            <div class="meter-track">
              <span id="viralBar"></span>
            </div>
          </div>

          <fieldset class="strategy-list">
            <legend>Стратегія ходу</legend>
            <label>
              <input type="radio" name="strategy" value="fast" checked />
              <span>
                <strong>Залити за 15 хвилин</strong>
                <small>Більше хайпу, більше шансів на баг з характером.</small>
              </span>
            </label>
            <label>
              <input type="radio" name="strategy" value="taste" />
              <span>
                <strong>Зробити зі смаком</strong>
                <small>Повільніше, зате клієнт може сказати: “о, не соромно”.</small>
              </span>
            </label>
            <label>
              <input type="radio" name="strategy" value="auto" />
              <span>
                <strong>Автоматизувати все</strong>
                <small>Агенти працюють, ти робиш вигляд, що це стратегія.</small>
              </span>
            </label>
          </fieldset>

          <button class="primary-button" id="shipButton" type="button">
            Запустити проєкт
          </button>
        </article>

        <aside class="stats-panel" aria-label="Статистика">
          <div class="stat-row">
            <span>Гроші</span>
            <strong id="moneyValue"></strong>
          </div>
          <div class="stat-row">
            <span>Hype</span>
            <strong id="hypeValue"></strong>
          </div>
          <div class="stat-row">
            <span>Репутація</span>
            <strong id="repValue"></strong>
          </div>
          <div class="stat-row">
            <span>Енергія</span>
            <strong id="energyValue"></strong>
          </div>
          <div class="level-block">
            <span>Рівень</span>
            <strong id="levelValue"></strong>
            <div class="meter-track thin">
              <span id="xpBar"></span>
            </div>
          </div>
        </aside>
      </section>

      <section class="lower-grid">
        <article class="feed-panel">
          <div class="panel-heading compact">
            <h2>Фід подій</h2>
            <button class="ghost-button small" id="restButton" type="button">Кава</button>
          </div>
          <ol class="event-feed" id="eventFeed"></ol>
        </article>

        <article class="agents-panel">
          <div class="panel-heading compact">
            <h2>AI-агенти</h2>
            <span id="agentCount"></span>
          </div>
          <div class="agent-list" id="agentList"></div>
        </article>

        <article class="leaderboard-panel">
          <div class="panel-heading compact">
            <h2>Топ креаторів</h2>
            <span>Сезон 2026</span>
          </div>
          <ol class="leaderboard" id="leaderboard"></ol>
        </article>
      </section>
    </main>

    <template id="eventTemplate">
      <li>
        <strong></strong>
        <span></span>
      </li>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
